{% extends 'travel/base.html' %}
{% block title %}新しいグループ - TravelPlan{% endblock %}
{% block content %}
<div class="container" style="max-width:520px">
  <a href="/groups/" style="font-size:13px;color:#666;display:inline-flex;align-items:center;gap:4px;margin-bottom:20px">← グループ一覧に戻る</a>
  <div class="card">
    <h1 style="font-size:18px;font-weight:600;margin-bottom:24px">新しいグループを作成</h1>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>グループ名 *</label>
        <input type="text" name="name" placeholder="例：家族旅行メンバー" required autofocus>
      </div>
      <div style="display:flex;gap:10px;margin-top:8px">
        <a href="/groups/" class="btn btn-secondary">キャンセル</a>
        <button type="submit" class="btn btn-primary">作成する</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
